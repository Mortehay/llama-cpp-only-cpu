name: llama-cpp-only-cpu

services:
  # 1. Model Downloader (Skips if exists)
  downloader:
    build:
      # Repo root, like sprite-generator: the provisioner and its shared reader
      # live in scripts/, which a ./downloader context cannot reach.
      context: ../../
      dockerfile: compose/develop/downloader/Dockerfile
    container_name: model_downloader
    platform: linux/amd64
    volumes:
      - ${MODELS_DIR:-../../models}:/models
      # Same arrangement as sprite-worker: operator scripts are bind-mounted,
      # never baked in (.dockerignore excludes /scripts/ from every build
      # context, because the repo is on 9p and nothing should cross it twice).
      # provision-models.py lives here and imports models_manifest.py beside it.
      - ../../scripts:/app/scripts:ro
      # The manifest is COPYed into the image too, so it works standalone; the
      # mount is what makes an edit take effect without a rebuild.
      - ./downloader/models.toml:/usr/local/bin/models.toml
      - ./downloader/models.txt:/usr/local/bin/models.txt
    env_file:
      - .env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Opt-in. At 1 huggingface_hub logs a full curl line per request, which
      # buries `make provision`'s plan and progress under thousands of lines
      # (and prints the token header placeholder on every one). Set HF_DEBUG=1
      # in the environment only when diagnosing a download.
      - HF_DEBUG=${HF_DEBUG:-0}
      # Same value the API and worker use, so the provisioner writes cache-
      # layout repos exactly where core_models.HF_CACHE later looks for them.
      # models.toml resolves its cache root from this variable.
      - HF_HUB_CACHE=/models
      # NOT offline: this is the one container whose job is to download.
      - HF_HUB_OFFLINE=0
      # The `model_downloads` queue the daemon consumes. Same URL the API and
      # worker use; without it the daemon idles instead of failing, so a stack
      # with no database still starts.
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    # The background download lane: the ONE consumer of `model_downloads`.
    #
    # It used to `tail -f /dev/null`, because having the service download on
    # startup put two containers on the same /models cache and deadlocked them
    # on HuggingFace's per-file locks:
    #   Still waiting to acquire lock on /models/.cache/huggingface/download/...
    # That hazard has not gone away — it is now handled rather than avoided.
    # This loop fetches only rows the UI queued, one at a time, and every fetch
    # (here AND in `make provision`, which is a separate container) is taken
    # under the advisory lock at /models/.provision.lock. See
    # models_manifest.provision_lock and .ai/decisions/0014.
    #
    # Still NOT wired into `make up`: starting the stack must not block on tens
    # of GB. `make up` only warns that weights are missing.
    #
    # The container also stays up so `make download` has something to exec into.
    # `-c` because the image's ENTRYPOINT is /bin/sh (which `make models` also
    # relies on). `exec` so the daemon is PID 1 and gets the stop signal.
    command: ["-c", "exec python3 /app/scripts/provision-daemon.py"]
    depends_on:
      db:
        condition: service_healthy

  # 2. Multi-Model LLM Engine
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:full
    platform: linux/amd64
    container_name: llm_engine
    depends_on:
      downloader:
        condition: service_started
    volumes:
      - ${MODELS_DIR:-../../models}:/models
    command: >
      --server --host 0.0.0.0 --port 8080
      --models-dir /models
      --models-max 4
      -ctk q8_0 -ctv q8_0
      --threads 8
      --mlock
    restart: unless-stopped

  # 3. Database
  db:
    image: postgres:15-alpine
    container_name: stats_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      # Must NOT sit on a Windows /mnt/c bind mount: initdb needs POSIX ownership
      # that DrvFs/9p cannot provide ("could not change permissions of directory"),
      # and 9p fsync semantics are not safe for a database. Defaults to the old
      # in-repo path only so a non-WSL checkout still works.
      - ${DB_DATA_DIR:-./db/data}:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 9. Redis (Celery Broker/Backend)
  redis:
    image: redis:7-alpine
    container_name: redis_broker
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # 5. Open WebUI (Chat Interface) - DISABLED
  #
  # Legacy from the llama.cpp era and not part of the sprite conveyor. Its image
  # is 7.16 GB, which is worth reclaiming on a machine this tight on disk.
  #
  # The whole block must stay commented, key AND body. Commenting only the
  # `open-webui:` line leaves the body indented under `redis:` above, and
  # compose then refuses the entire file:
  #   yaml: construct errors: line 87: mapping key "image" already defined at line 74
  # That takes down every service, not just this one.
  #
  # open-webui:
  #   image: ghcr.io/open-webui/open-webui:main
  #   container_name: open_webui
  #   environment:
  #     - OPENAI_API_BASE_URL=http://stats_collector:8000/v1
  #     - OPENAI_API_KEY=sk-dummy
  #     - WEBUI_AUTH=False
  #     - ENABLE_OLLAMA_API=false
  #     - ENABLE_SIGNUP=false
  #   ports:
  #     - "3000:8080"
  #   restart: unless-stopped
  #   depends_on:
  #     - collector

  # 6. Grafana (Stats Visualizer) - DISABLED
  # Legacy metrics for the llama.cpp stack; nothing in the sprite conveyor uses
  # it. Key AND body must stay commented - see the note on open-webui above.
  #
  # grafana:
  #   image: grafana/grafana:latest
  #   container_name: grafana
  #   environment:
  #     - GF_SECURITY_ADMIN_PASSWORD=admin
  #   ports:
  #     - "3001:3000"
  #   restart: unless-stopped
  #   depends_on:
  #     - db

  # 4. Collector
  collector:
    build: 
      context: ../../
      dockerfile: compose/develop/collector/Dockerfile
    container_name: stats_collector
    depends_on:
      llm-server:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      - ../../src/collector:/app
    environment:
      LLM_URL: "http://llm-server:8080"
      DB_URL: "postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}"
    ports:
      - "8002:8000"

  # 7. Model Orchestrator UI
  orchestrator:
    build:
      context: ../../
      dockerfile: compose/develop/orchestrator/Dockerfile
    container_name: model_orchestrator
    volumes:
      - ${MODELS_DIR:-../../models}:/models
      - ../../src/orchestrator:/app
    environment:
      - HF_TOKEN=${HF_TOKEN}
    ports:
      - "7860:7860"
    restart: unless-stopped
    depends_on:
      - downloader

  # 8. Sprite Generator (API)
  sprite-generator:
    build:
      context: ../../
      dockerfile: compose/develop/sprite_generator/Dockerfile
    container_name: sprite_generator
    volumes:
      - ${MODELS_DIR:-../../models}:/models
      - ../../src/sprite_generator:/app
      - ${IMAGES_DIR:-../../images}:/app/images
      - ${AUDIO_DIR:-../../audio}:/app/audio
      # Operator tools (API verification, fetch, acceptance checks). Read-only
      # and separate from /app: these are run via `docker exec` or
      # `docker compose run`.
      #
      # ONE EXCEPTION, added 2026-10-13: `models_status.py` imports
      # `scripts/models_manifest.py` for the manifest parse and the "is this
      # model present" test. Deliberately imported rather than reimplemented -
      # that test is subtle (a bare cache directory is what an interrupted
      # download leaves behind) and a second copy of it is exactly the drift
      # `make test-models-manifest` exists to catch. SCRIPTS_DIR overrides the
      # path.
      - ../../scripts:/app/scripts:ro
      # The manifest itself, so the API can report declared-vs-present without
      # shelling into the downloader. Read-only: the API never writes it.
      #
      # NOT under /app. /app is itself a bind mount of src/sprite_generator, so
      # mounting a file at /app/models.toml made Docker create the mount point
      # inside the SOURCE TREE - a 0-byte src/sprite_generator/models.toml
      # appeared in git status. Anything mounted into a path that lives inside
      # another bind mount does that.
      - ./downloader/models.toml:/etc/sprite/models.toml:ro
    environment:
      # Read by tasks.py as EDIT_ENABLED. Both this service and sprite-worker
      # import tasks.py, and main.py's /api/edit answers its 503 from the same
      # constant, so the variable has to be set on BOTH or the endpoint refuses
      # a request the worker would have accepted. It was spelled EDIT_ENABLE
      # here and in .env, which nothing reads: `env` inside the container
      # showed it set and /api/edit still returned 503 with
      # "enable_with: EDIT_ENABLED=1".
      #
      # Turning it on is survivable now that the WSL VM has 41GB rather than
      # the 11GB the refusal text still describes. The RAM and VRAM preflights
      # in get_edit_pipeline remain the thing that stops a load that would
      # OOM-kill the worker, so this is not the only guard.
      - EDIT_ENABLED=${EDIT_ENABLED:-0}
      - HF_TOKEN=${HF_TOKEN}
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      # Unbuffered stdout: without this, startup/migration errors sit in the
      # buffer and only surface in `docker logs` minutes after the fact.
      - PYTHONUNBUFFERED=1
      # /app is the code mount. `celery` is at /usr/local/bin/celery, so
      # sys.path[0] is /usr/local/bin, and Celery only puts the working
      # directory on sys.path WHILE it imports the app - then removes it. The
      # result is that a module-level `import concept` resolves at boot and the
      # identical import inside a running task raises ModuleNotFoundError.
      # Setting PYTHONPATH makes /app importable for the whole process life.
      - PYTHONPATH=/app
      - SPRITE_API_TOKEN=${SPRITE_API_TOKEN:-}
      - A1111_GENERATE_TIMEOUT_S=${A1111_GENERATE_TIMEOUT_S:-285}
      # How long POST /api/audio blocks before answering 503 + Retry-After.
      # The build is NOT cancelled when it expires, so this is a patience
      # setting, not a budget. Set it to 1 to exercise that path.
      - AUDIO_GENERATE_TIMEOUT_S=${AUDIO_GENERATE_TIMEOUT_S:-240}
      # Model gateway (model_gateway.py): how long a model selected in the UI
      # holds the card after its last job, and how often a deferred job
      # re-asks. Both services read them, so both must be listed here.
      - MODEL_SWITCH_IDLE_S=${MODEL_SWITCH_IDLE_S:-300}
      - MODEL_GATEWAY_RECHECK_S=${MODEL_GATEWAY_RECHECK_S:-5}
      # Object cutouts: birefnet (AI segmentation, cutout.py) or floodfill
      # (the old corner-colour key) as the rollback. See transparent-cutouts spec.
      - CUTOUT_ENGINE=${CUTOUT_ENGINE:-birefnet}
      # Every weight is already cached, so stop huggingface_hub revalidating
      # each file against the Hub on every pipeline load. Those calls are
      # metadata-only (a few KB) but they put generation on the network path
      # for no benefit and fail confusingly when the LAN is down. Override when
      # fetching new models:
      #   docker compose run -e HF_HUB_OFFLINE=0 ... scripts/fetch-qwen-edit.py
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      # Point the WHOLE huggingface_hub stack at the mounted cache, not just
      # the calls that happen to pass cache_dir=.
      #
      # diffusers' from_single_file loads the architecture config through its
      # own path and does NOT forward cache_dir to it. Online that is invisible
      # - it just downloads the config into the container's default cache at
      # ~/.cache/huggingface, which dies with the container. Offline it fails
      # with "Qwen/Qwen-Image-Edit-2511 does not appear to have a file named
      # config.json" while that file is demonstrably sitting in /models.
      - HF_HUB_CACHE=/models
    ports:
      - "8001:8001"
    # No restart policy on purpose. A container that Docker *restarts* (at host
    # boot, or after a kill) can re-attach to the compose network without working
    # embedded DNS, leaving `db`/`redis` permanently unresolvable — and `make up`
    # then reports it as "Running" and does nothing. Start it via `make up`.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # -O /dev/null, not --spider: --spider sends HEAD and the route is GET-only (405).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Importing torch/diffusers takes ~25s before uvicorn serves.
      start_period: 120s
    tmpfs:
      - /app/images/temp:size=2G,mode=1777

  # 10. Sprite Worker (Celery)
  sprite-worker:
    build:
      context: ../../
      dockerfile: compose/develop/sprite_generator/Dockerfile
    container_name: sprite_worker
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info", "--concurrency=1"]
    volumes:
      - ${MODELS_DIR:-../../models}:/models
      - ../../src/sprite_generator:/app
      - ${IMAGES_DIR:-../../images}:/app/images
      - ${AUDIO_DIR:-../../audio}:/app/audio
      # Read-only, and separate from /app on purpose: these are operator tools
      # (fetch, acceptance checks, smoke tests) run via `docker compose run`,
      # not modules the worker imports. Mounted so the Makefile's 2D-conveyor
      # targets have something to execute.
      - ../../scripts:/app/scripts:ro
    environment:
      # The same constant as on sprite-generator above; needed in both places.
      - EDIT_ENABLED=${EDIT_ENABLED:-0}
      - HF_TOKEN=${HF_TOKEN}
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
      # /app is the code mount. `celery` is at /usr/local/bin/celery, so
      # sys.path[0] is /usr/local/bin, never /app. Celery puts the working
      # directory on sys.path only WHILE it imports the app (import_from_cwd)
      # and removes it again - so a module-level `import concept` resolves at
      # boot while the identical import inside a running task raises
      # ModuleNotFoundError. This makes /app importable for the process life.
      - PYTHONPATH=/app
      - SPRITE_API_TOKEN=${SPRITE_API_TOKEN:-}
      - A1111_GENERATE_TIMEOUT_S=${A1111_GENERATE_TIMEOUT_S:-285}
      # How long POST /api/audio blocks before answering 503 + Retry-After.
      # The build is NOT cancelled when it expires, so this is a patience
      # setting, not a budget. Set it to 1 to exercise that path.
      - AUDIO_GENERATE_TIMEOUT_S=${AUDIO_GENERATE_TIMEOUT_S:-240}
      # Model gateway (model_gateway.py): how long a model selected in the UI
      # holds the card after its last job, and how often a deferred job
      # re-asks. Both services read them, so both must be listed here.
      - MODEL_SWITCH_IDLE_S=${MODEL_SWITCH_IDLE_S:-300}
      - MODEL_GATEWAY_RECHECK_S=${MODEL_GATEWAY_RECHECK_S:-5}
      # Object cutouts: birefnet (AI segmentation, cutout.py) or floodfill
      # (the old corner-colour key) as the rollback. See transparent-cutouts spec.
      - CUTOUT_ENGINE=${CUTOUT_ENGINE:-birefnet}
      # Every weight is already cached, so stop huggingface_hub revalidating
      # each file against the Hub on every pipeline load. Those calls are
      # metadata-only (a few KB) but they put generation on the network path
      # for no benefit and fail confusingly when the LAN is down. Override when
      # fetching new models:
      #   docker compose run -e HF_HUB_OFFLINE=0 ... scripts/fetch-qwen-edit.py
      - HF_HUB_OFFLINE=${HF_HUB_OFFLINE:-1}
      # Point the WHOLE huggingface_hub stack at the mounted cache, not just
      # the calls that happen to pass cache_dir=.
      #
      # diffusers' from_single_file loads the architecture config through its
      # own path and does NOT forward cache_dir to it. Online that is invisible
      # - it just downloads the config into the container's default cache at
      # ~/.cache/huggingface, which dies with the container. Offline it fails
      # with "Qwen/Qwen-Image-Edit-2511 does not appear to have a file named
      # config.json" while that file is demonstrably sitting in /models.
      - HF_HUB_CACHE=/models
    # 1024 file descriptors is not enough for this worker, and running out does
    # not look like running out.
    #
    # Loading a sharded pipeline mmaps every safetensors shard and fans the copy
    # out over a thread pool, so a single from_pretrained holds hundreds of fds.
    # A load that fails partway leaks them, and after a few retries the worker
    # crossed the limit — at which point Redis and DNS stopped working too:
    #   OSError: [Errno 24] Too many open files
    #   could not translate host name "db" to address: System error
    # The worker went on running, silently unable to reach the broker, and the
    # task queued behind it sat at "Waiting in queue..." forever. The container
    # default is the Docker daemon's soft limit (1024 here); the hard limit is
    # already 1048576, so this only raises the soft one.
    ulimits:
      nofile:
        soft: 65536
        hard: 1048576
    # No restart policy — see the note on sprite-generator above.
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      downloader:
        condition: service_started
    tmpfs:
      - /app/images/temp:size=2G,mode=1777
  # Stage 2 of the 3D conveyor: character image -> mesh. See
  # .ai/decisions/0004-pivot-to-3d-conveyor.md
  #
  # Isolated from the sprite images on purpose: Python 3.11 (UniRig needs it
  # later, sprite_worker is 3.10) and compiled extensions that must never put
  # the working 2D pipeline at risk.
  #
  # `sleep infinity` rather than a queue worker. The mesh step has one
  # unanswered question in front of it - whether a generated stylised character
  # yields a usable mesh - and wiring it into Celery before that is answered
  # would be building on an assumption. Drive it with:
  #   docker exec mesh_worker python /app/mesh.py /app/images/<core>.png -o /app/images/out.obj
  mesh-worker:
    build:
      context: ../../
      dockerfile: compose/develop/mesh_worker/Dockerfile.cuda
    container_name: mesh_worker
    # Was `sleep infinity` while the 3D route was a manual spike. It now
    # consumes the mesh3d queue: a turnaround uses no GPU, so it runs in
    # parallel with whatever sprite-worker is doing on the card.
    #
    # --pool=solo for a different reason than sprite-worker's: not one card,
    # but stages that are subprocesses each loading torch. Two at once on 10
    # threads is slower than one after the other.
    command: ["celery", "-A", "mesh_tasks", "worker",
              "--loglevel=info", "--pool=solo", "-Q", "mesh3d"]
    volumes:
      - ${MODELS_DIR:-../../models}:/models
      - ../../src/mesh_worker:/app
      - ${IMAGES_DIR:-../../images}:/app/images
      # READ-ONLY, and only for pixelate.py + sheet.py, which turnaround.py
      # reuses so keying and the 48x64 fit are the project's own code rather
      # than a second implementation. Both are standalone (numpy + PIL), so
      # this pulls in no sprite-stack dependencies.
      - ../../src/sprite_generator:/sprite:ro
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONUNBUFFERED=1
      - DB_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      - REDIS_URL=redis://redis:6379/0
      # /opt/TripoSR FIRST and explicitly: the image sets
      # PYTHONPATH=/opt/TripoSR:/app for TripoSR's `tsr` package, and a
      # compose `environment` entry REPLACES it rather than extending
      # it - dropping /opt/TripoSR broke mesh.py with
      # ModuleNotFoundError: No module named 'tsr'.
      - PYTHONPATH=/opt/TripoSR:/app:/sprite
    profiles: ["mesh"]

  # Stage 3 of the 3D conveyor: mesh -> rigged mesh. See
  # .ai/decisions/0004-pivot-to-3d-conveyor.md
  #
  # Separate from mesh-worker because UniRig pins transformers==4.51.3 against
  # TripoSR's 4.35.0; sharing would run one of them untested, and that fails
  # silently rather than loudly. Base and torch layers are shared on disk.
  #
  # `sleep infinity` for the same reason as mesh-worker: the open question is
  # whether UniRig emits a CONSISTENT skeleton across characters, and wiring it
  # into Celery before that is answered would build on an assumption.
  rig-worker:
    build:
      context: ../../
      dockerfile: compose/develop/rig_worker/Dockerfile.cuda
    container_name: rig_worker
    command: ["sleep", "infinity"]
    volumes:
      - ${MODELS_DIR:-../../models}:/models
      - ../../src/rig_worker:/app
      - ${IMAGES_DIR:-../../images}:/app/images
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PYTHONUNBUFFERED=1
    profiles: ["rig"]
