#   "Defaulting to unsafe serialization"
#     - the same .bin fact, pre-existing, not caused by the filter.
used_by = ["core_models.CORE_MODELS", "step 2 (SD1.5 + ControlNet)"]
why = """
The only model that produced real pixel art unaided: hard grid, bounded
palette, one character, 3.0 s at 20 steps (decisions/0002). SD1.5, so it is the
