"""
notes = "Needs its OWN trigger word, 'pixelsprite'. A foreign trigger is inert."

[[model]]
name = "openpose-sd15"
kind = "hf-cache"
tier = "required"
repo = "lllyasviel/control_v11p_sd15_openpose"
# Measured 2026-10-13: unfiltered 4.04 GB, because the repo ships the same
# weights four times - .bin and .safetensors, each at fp32 and fp16. diffusers
# prefers `diffusion_pytorch_model.safetensors`, and the loader passes no
# `variant=`, so the fp32 safetensors (1.35 GB) is the one read. Everything
# else, plus the demo PNGs, is dead weight.
#
# NOTE the asymmetry with the SDXL sibling: that repo publishes NO
# `diffusion_pytorch_model.safetensors`, so there the .bin is what loads and
# this same filter would break it. Per-repo, not a house rule.
ignore = ["*.bin", "*.fp16.safetensors", "*.png", "images/*"]
approx_gb = 1.35
# LOAD-TESTED 2026-10-13: with only config.json +
# diffusion_pytorch_model.safetensors present and HF_HUB_OFFLINE=1,
# ControlNetModel.from_pretrained loads it (361M params), as does the real
# step-2 StableDiffusionControlNetImg2ImgPipeline.
used_by = ["tasks.OPENPOSE_CONTROLNET", "poses.py"]
why = """
Step 2's pose conditioning. poses.py authors COCO-18 skeletons specifically
against this checkpoint; the SDXL ControlNet measured 3.6x weaker.
"""
notes = """
Was absent until 2026-10-13 - the D: cold archive it was presumed to be in no
longer exists - so pose-conditioned step 2 had been failing silently.
`use_pose` turns on automatically for any action with a cycle (tasks.py), and
from_pretrained under HF_HUB_OFFLINE=1 cannot recover a missing repo.
Fetched through `make provision`: 1.44 GB fp32 + 722 MB fp16.

Do NOT filter this to fp16 - see the sibling SDXL entry. The loader passes no
`variant=`, so fp32 is what is read.

A measurement note for anyone sizing a deploy: the repo DIRECTORY measured
824 KB right after a complete download, because snapshots are symlinks into a
top-level xet `blobs/` store. `du` on a models--* directory is not a size.
"""

[[model]]
name = "openpose-sdxl"
kind = "hf-cache"
tier = "required"
repo = "thibaud/controlnet-openpose-sdxl-1.0"
ignore = ["*.png", "*.jpg", "*.jpeg", "*.gif"]
approx_gb = 10.04
used_by = ["tasks.OPENPOSE_CONTROLNET_SDXL"]
why = """
The substitute get_sd_pipeline swaps in when the step-2 target turns out to be
SDXL - callers pass OPENPOSE_CONTROLNET without knowing which family they get,
and a ControlNet must match the UNet it conditions.
"""
notes = """
DO NOT add an fp16 or safetensors allow-list to this entry. PROVEN by a real
step-2 run, 2026-10-13, which logged:

  Loading ControlNet 'thibaud/controlnet-openpose-sdxl-1.0'...
  An error occurred while trying to fetch thibaud/controlnet-openpose-sdxl-1.0:
  ... does not appear to have a file named diffusion_pytorch_model.safetensors.

diffusers probes for the safetensors, does not find one in this repo, and
falls back to `diffusion_pytorch_model.bin`. That log line is NORMAL here and
is not an error to fix. Filter the .bin away and the fallback has nothing to
land on. `tasks.py` also passes no `variant="fp16"`, unlike the SDXL base
pipeline beside it, so the fp32 weights are the ones read. The `ignore` here
is only the repo's demo screenshots.

Fetched 2026-10-13 (absent until then, so BOTH families of pose-conditioned
step 2 were failing). MEASURED after that fetch, 10.3 GB of weights for one
ControlNet, because the repo ships the same model three ways:

  diffusion_pytorch_model.bin                  4772 MB  <- what loads
  OpenPoseXL2.safetensors                      4772 MB  same weights, ignored
  control-lora-openposeXL2-rank256.safetensors  739 MB  a LoRA variant

Only the .bin is read: `ControlNetModel.from_pretrained` looks for
`diffusion_pytorch_model.*`, and this repo publishes no
`diffusion_pytorch_model.safetensors`. An allow-list of
["config.json", "diffusion_pytorch_model.bin"] would therefore cut ~5.5 GB -
NOT done, because it is reasoned from the loader rather than tested, and the
failure mode is a clean download that dies at load time on a machine where
this is the fallback path. Narrow it only with a real fetch behind it.

Measured 3.6x weaker than the SD1.5 one; it exists for correctness on SDXL
targets, not for quality.
"""


