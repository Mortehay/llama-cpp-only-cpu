# the pipeline builds with every component (unet 860M, vae, text_encoder,
# tokenizer, scheduler), and so does the real step-2 shape
# (StableDiffusionControlNetImg2ImgPipeline over this plus the SD1.5
# ControlNet). Two log lines are EXPECTED and are not failures:
#   "Error no file named diffusion_pytorch_model.safetensors found in .../vae"
