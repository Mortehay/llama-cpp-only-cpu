kind = "hf-cache"
tier = "required"
repo = "openai/clip-vit-large-patch14"
# Weights in four frameworks, none of them used. Measured 2026-10-13: the
# unfiltered repo is 6.38 GB - tf_model.h5, pytorch_model.bin, model.safetensors
# and flax_model.msgpack at 1.59 GB each - for ~5 MB of tokenizer. The SD1.5
# checkpoint ships its own text_encoder; only the tokenizer is wanted here,
# which is also all that is on disk on the host this was written from.
ignore = ["*.h5", "*.msgpack", "*.bin", "*.safetensors"]
approx_gb = 0.005
used_by = ["SD1.5 pipelines (PublicPrompts/All-In-One-Pixel-Model) via diffusers"]
why = "Tokenizer for the SD1.5 lane. Small, and its absence surfaces as an opaque tokenizer error."
notes = """
Subtractive `ignore`, not `allow`, on purpose: a wrong allow-list silently
drops a needed config, whereas this can only drop weights that are known to be
unused. Selection verified with `make provision audit=1 files=1
only=clip-vit-large`; re-run that after changing it.

LOAD-TESTED 2026-10-13: with only the tokenizer/config files present and
HF_HUB_OFFLINE=1, CLIPTokenizer.from_pretrained loads and tokenises. 6.38 GB
of weights in four frameworks really are unused here.
"""

