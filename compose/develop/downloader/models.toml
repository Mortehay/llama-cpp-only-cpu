# The model manifest: everything a fresh machine needs under MODELS_DIR.
#
# READ THIS BEFORE ADDING AN ENTRY.
#
# This file replaces `models.txt` as the thing that answers "what weights does
# this project need". `models.txt` is NOT that file and never was: it feeds the
# llama.cpp `llm-server` router, which retired to the `legacy-llm` compose
# profile on 2026-10-01, and its one remaining active entry was superseded by
# the brain lane (decisions/0013). It is kept, unchanged, for anyone reviving
# that profile. Do not add models to it.
#
# WHY A SCHEMA AND NOT A LIST OF REPO IDS
# Four different kinds of thing live under MODELS_DIR, and each needs a
# different fetch. Getting the kind wrong does not fail loudly - it produces
# files in a layout nothing looks in. See `.ai/domain.md`.
#
#   hf-cache          HF cache layout (models--<org>--<name>/), resolved by
#                     REPO ID, never by path. `hf download --local-dir` makes
#                     the WRONG shape here and diffusers will not find it.
#   hf-file           a single file at an explicit destination, TWO levels
#                     below /models. Depth is load-bearing - see `dest`.
#   checkpoint-tree   a component layout some other project owns.
#   local             trained on this machine. CANNOT be downloaded.
#
# TIERS
#   required   the stack's default paths do not work without it.
#   optional   a named feature degrades or disappears. `skipping` says which.
#   (dead)     see the [[dead]] table at the bottom - deliberately NOT fetched.
#
# SIZES are approximate and some are unverified: HF cache snapshots are
# symlinks into blobs/, so `du` over them under-reports. Where a byte count is
# exact it was measured from the file itself on 2026-10-13. Run
# `make provision tier=... dry=1` for authoritative sizes from the Hub.
#
# FIELDS
#   name        manifest-local id, used by `--only`.
#   kind        hf-cache | hf-file | checkpoint-tree | local (see above).
#   tier        required | optional.
#   repo        Hub repo id. Absent for `local`.
#   file        hf-file only: the filename IN THE REPO.
#   as          hf-file only: save under THIS name instead. Required wherever
#               the Hub's name and the name the code expects differ - two
#               entries here need it, and getting it wrong leaves a file that
#               exists but is never found.
#   dest        directory under the cache root. hf-file/checkpoint-tree/local.
#   allow       glob allow-list. Without one, some repos are 100 GB+.
#   ignore      glob deny-list. The 4bit transformer ignore saves 11.59 GB.
#   gated       true means accept the terms on the Hub first, with the same
#               account as HF_TOKEN, or the fetch 401s.
#   fetch       "self" means another project downloads it; the provisioner
#               only verifies presence.
#   bytes       exact size, measured. local_bytes when it differs from the Hub.
#   provenance  "substitute" means this is NOT the file that was benched.
#   missing_on_source_host
#               true: declared because the CODE needs it, not because it was
#               present when this manifest was written.
#
# EVERY entry must carry `used_by`, naming the code that asks for it.
# `make test-models-manifest` walks the source for model references and fails
# if one is neither declared here nor listed under [[dead]]. That test is the
# whole point: `models.txt` did not rot because it was written badly, it rotted
# because nothing ever compared it to the code.

[meta]
version = 1
# Both the HF cache root and the base for `dest`. compose sets HF_HUB_CACHE
# and MODELS_DIR to the same path; core_models.py reads HF_HUB_CACHE.
cache_root_env = "HF_HUB_CACHE"
cache_root_default = "/models"


