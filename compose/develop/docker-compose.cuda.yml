# GPU override, layered on top of docker-compose.yml.
#
# The Makefile appends this file automatically when `nvidia-smi` is on PATH:
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml ...
# Until now that reference pointed at a file that did not exist, so *every*
# make target failed on a GPU host. This is that file.
#
# Host prerequisite: nvidia-container-toolkit. Verify before using:
#   docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
# or `make gpu-check`.

services:
  # Inference lives here and nowhere else. Concurrency stays at 1 (set in the
  # base file): a second worker would double-load pipelines into 12GB of VRAM.
  sprite-worker:
    build:
      dockerfile: compose/develop/sprite_generator/Dockerfile.cuda
    # --pool=solo: run tasks in the main process instead of forked children.
    #
    # Celery's default prefork pool forks after importing tasks.py. If ANYTHING
    # has initialized a CUDA context in the parent by then, every child dies with
    # "Cannot re-initialize CUDA in forked subprocess" — CUDA contexts do not
    # survive fork(). tasks.py is careful not to touch CUDA at import, but that
    # is a property one stray diagnostic line can silently destroy (and did).
    #
    # Concurrency is 1 regardless, because a second worker would double-load
    # pipelines into 12GB of VRAM — so the prefork pool buys nothing here.
    #
    # Trade-off: `celery revoke(terminate=True)` cannot kill an in-flight task
    # without a child to signal. Cancellation still works through the
    # cooperative Redis flag that the progress callbacks poll (is_cancelled).
    command: ["celery", "-A", "tasks", "worker", "--loglevel=info",
              "--concurrency=1", "--pool=solo"]
    environment:
      - COMPUTE_DEVICE=cuda
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Long-lived worker + repeated pipeline loads fragments the caching
      # allocator badly on a 12GB card; expandable_segments reclaims it.
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  sprite-generator:
    build:
      dockerfile: compose/develop/sprite_generator/Dockerfile.cuda
    environment:
      # The API process imports tasks.py (and therefore torch) but never runs
      # inference. Pin it to CPU so it cannot reserve VRAM the worker needs.
      - COMPUTE_DEVICE=cpu

  # llm-server on the GPU. This reverses an earlier decision to leave it on CPU;
  # the reasoning there was that a resident GGUF competes with the diffusion
  # pipeline on a single 12GB card. That is still true, so the budget is now
  # explicit rather than the service being kept off the GPU entirely.
  #
  # THREE things are required, and any one alone does nothing:
  #   1. the -cuda image. The plain `full` tag is a CPU-only build.
  #   2. a device reservation. Without it the container cannot see the card.
  #   3. -ngl. llama.cpp offloads ZERO layers by default, so a CUDA build with
  #      a visible GPU still runs entirely on the CPU - which is exactly what
  #      the running stack was doing: 99% CPU, 93% RAM, GPU idle at 15%.
  #
  # VRAM BUDGET. The chat models are now 8-9GB GGUFs fully offloaded, plus
  # ~0.5-1GB of KV cache. That is most of a 12GB card, and it does NOT leave
  # room for a diffusion pipeline (~2-4GB for SD1.5+ControlNet, ~7GB for
  # SDXL-Turbo). The two services cannot both hold the card at once.
  #
  # --sleep-idle-seconds is what makes them share it anyway: the router puts the
  # model to sleep and releases the GPU after two minutes with no requests, so
  # a sprite job started while nobody is chatting gets a free card. The cost is
  # a reload (seconds, from the local cache) on the next message. It defaults to
  # -1, meaning never sleep, which on this hardware would mean sprite generation
  # simply OOMs whenever a chat model has been used since boot.
  #
  # --models-max 1 because two 8-9GB models resident is not survivable here,
  # regardless of how many are listed in models.txt.
  llm-server:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    command: >
      --server --host 0.0.0.0 --port 8080
      --models-dir /models
      --models-max 1
      -ctk q8_0 -ctv q8_0
      --threads 4
      -ngl 99
      --sleep-idle-seconds 120
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
